name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: unzip -q *.zip
      - run: gradle :core:common:test :app:assembleDebug --stacktrace
        working-directory: GabBrowser
      - uses: actions/upload-artifact@v4
        with:
          name: GabBrowser-debug-apk
          path: GabBrowser/app/build/outputs/apk/debug/*.apk
